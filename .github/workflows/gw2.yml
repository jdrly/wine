# gw2 (jdrly/gw2-on-mac#40): my ntdll.so for Mach9 $MACH9_VERSION's engine, built on GitHub's runner
# the way Mach9's CI built the engine's, and checked against the engine's file. Nothing here runs on
# my Mac.
#
# build: one Wine tree configured as Mach9 configures its own (.github/gw2/ntdll.zsh), in the
#   engine's paths, with Xcode $XCODE_VERSION, macOS $MACOSX_DEPLOYMENT_TARGET and llvm-mingw
#   $LLVM_MINGW_VERSION. In it, one after the other:
#   - $BASE_COMMIT, the commit the engine was built from, compared with the engine's ntdll.so by
#     .github/gw2/ntdll-compare.py baseline: the same exports and imports, and the header, every
#     section, the load commands and the link edit data byte for byte
#   - the same with one line of NtYieldExecution changed, which that compare has to fail and name
#   - this commit, every object compiled again, compared by ntdll-compare.py patched: each object
#     none of whose inputs (makedep's rule for it: its .c and every header it includes) the commit
#     changes is the base build's, by its compile command, code, data, relocations and symbols, and
#     the summary lists the other objects' changed functions and the changed inputs that touched them
#   The per-function listing with masked addresses that follows a failed byte gate only names
#   what differs; it is not the gate and never passes or fails a build.
#   Artifact ntdll-mach9-<commit>: ntdll.so, VERSION, COPYING.LIB, LICENSE, kept 7 days.
# tests: tests/gw2/*.c built for Win64 x86_64 with llvm-mingw and run by tests/gw2/matrix.zsh under
#   the engine from the release tarball: with its own ntdll.so, and with mine in each
#   WINE_HEAT_WAKE mode, with no WINE_HEAT_* variable and with them set for another program.
# lint: actionlint, and the Python script compiles.
# publish: after the others are green, packs ntdll-mach9-<commit>.tar.xz and prints its sha256. For
#   a push to gw2-on-mac it adds the archive to the pre-release mach9-builds, the one release this
#   workflow makes, never marked latest, and keeps its 30 newest assets.
name: GW2

on:
  pull_request:
    branches: [gw2-on-mac]
  push:
    branches: [gw2-on-mac]

permissions:
  contents: read

concurrency:
  group: gw2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The PR's own commit, not GitHub's merge commit, so VERSION and the file's version string name it
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # The build's scripts, from the commit this workflow file is from: on a pull request that is
  # GitHub's merge commit (github.sha), so the workflow and the scripts it calls always agree,
  # whether or not the PR's head is behind gw2-on-mac. The source under test stays $COMMIT.
  GW2: ${{ github.workspace }}/gw2-ci/.github/gw2
  # athei/wine's commit Mach9 0.3.1 was built from (wine-11.21-37-g53def89293), where gw2-on-mac starts
  BASE_COMMIT: 53def89293adfe1a62c43ef46abe80a536e9ca49
  # What Mach9's release run of v0.3.1 used (athei/mach9 run 42769825957): Xcode 26.6 (SDK 26.5,
  # clang-2100.1.1.101) on the macos-26 image (macos-26-arm64 20261102.0473.1), and its
  # pins/redist.env and bin/lib/profile.sh. Mine runs on the same image, with Xcode 26.6 selected
  # by name.
  XCODE_VERSION: "26.6"
  LLVM_MINGW_VERSION: "20261104"
  LLVM_MINGW_SHA256: 66cbd5178c4a71b0d473e68ede172f8eb7d15d023e67f39201d0a69e21f6bf3c
  MACH9_VERSION: v0.3.1
  MACH9_SHA256: 90aff9a897ed0ff9aac44d0e06f0aecd3ee985afb38037f3f915451e51fa974e

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ntdll.so
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.4"
      SRC: /Users/runner/work/mach9/mach9/src
      BUILD: /Users/runner/work/mach9/mach9/build/wine
      MINGW_DIR: ${{ github.workspace }}/toolchains/llvm-mingw
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      # first, so a missing Xcode stops the job within a minute
      - name: Select Xcode
        run: |
          {
            echo "### Runner"
            echo '```'
            echo "image $ImageOS $ImageVersion, macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            ls -d /Applications/Xcode_*.app
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          app=/Applications/Xcode_$XCODE_VERSION.app
          if [[ ! -d $app ]]; then
            echo "::error::Xcode $XCODE_VERSION isn't on this runner's image ($ImageOS $ImageVersion), so the engine's ntdll.so can't be rebuilt."
            exit 1
          fi
          sudo xcode-select -s "$app"
          {
            echo "### Toolchain"
            echo '```'
            xcodebuild -version | sed -n 1p
            echo "macOS SDK $(xcrun -sdk macosx --show-sdk-version)"
            clang --version | sed -n 1p
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: gw2-ci
          sparse-checkout: .github/gw2
          persist-credentials: false
      - name: The scripts are this workflow's
        run: |
          [[ $(git -C gw2-ci rev-parse HEAD) == "$GITHUB_SHA" && -f $GW2/ntdll.zsh && -f $GW2/ntdll-compare.py ]] ||
            { echo "::error::the scripts of $GITHUB_SHA, the commit this workflow file is from, aren't there"; exit 1; }
          echo "scripts from $GITHUB_SHA, source from $COMMIT"
      # The source to build, with the whole history for git describe, without the file contents
      # until a checkout needs them, as Mach9's CI checks it out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Restore Mach9
        id: mach9
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mach9-tarball-${{ env.MACH9_VERSION }}
          path: toolchains/mach9.tar.xz
      - name: Download Mach9
        if: steps.mach9.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          curl -fsSL --retry 3 -o toolchains/mach9.tar.xz \
            "https://github.com/athei/mach9/releases/download/$MACH9_VERSION/wine-$MACH9_VERSION-macos-arm64.tar.xz"
      - name: Save Mach9
        if: steps.mach9.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mach9-tarball-${{ env.MACH9_VERSION }}
          path: toolchains/mach9.tar.xz
      - name: Unpack the engine's unix modules
        run: |
          echo "$MACH9_SHA256  toolchains/mach9.tar.xz" | shasum -a 256 -c
          mkdir -p toolchains/engine
          tar -xf toolchains/mach9.tar.xz -C toolchains/engine --strip-components 1 wine/lib/wine/aarch64-unix
      # every address-bearing instruction of the engine's file changed in turn has to show
      - name: The compare's self-test
        run: python3 -I "$GW2/ntdll-compare.py" selftest toolchains/engine/lib/wine/aarch64-unix

      - name: Restore llvm-mingw
        id: mingw
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          path: toolchains/llvm-mingw
      - name: Download llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        run: |
          f="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$f"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$f" | shasum -a 256 -c
          mkdir -p toolchains/llvm-mingw
          tar -xf "$RUNNER_TEMP/$f" -C toolchains/llvm-mingw --strip-components 1
      - name: Save llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          path: toolchains/llvm-mingw

      # Mach9's pins/brew-formulae, as far as Wine's configure looks for them
      - name: Install Homebrew's bison, freetype, gnutls and SDL
        run: brew install bison freetype gnutls sdl2-compat pkgconf

      - name: Configure
        run: |
          mkdir -p "${SRC%/*}"
          mv src "$SRC"
          "$GW2/ntdll.zsh" prepare "$BASE_COMMIT"
          "$GW2/ntdll.zsh" configure

      - name: Build the engine's commit
        id: base
        run: |
          "$GW2/ntdll.zsh" build | tee "$RUNNER_TEMP/base-build.log"
          cp -p "$BUILD/dlls/ntdll/ntdll.so" "$RUNNER_TEMP/baseline-ntdll.so"
          # what the patched build's objects are compared with, with the times its link saw
          mkdir "$RUNNER_TEMP/base-objects"
          cp -p "$BUILD"/dlls/ntdll/unix/*.o "$RUNNER_TEMP/base-objects/"
          # makedep's rules: each object's inputs, which decide whether a commit touched it
          cp "$BUILD/Makefile" "$RUNNER_TEMP/base-Makefile"
          # config.h and the generated headers, which reach an object besides its source
          (cd "$BUILD" && find include -type f -print0 | sort -z | xargs -0 shasum -a 256) >"$RUNNER_TEMP/base-headers.txt"
      - name: Baseline compare
        id: baseline
        run: |
          status=0
          python3 -I "$GW2/ntdll-compare.py" baseline "$RUNNER_TEMP/baseline-ntdll.so" toolchains/engine/lib/wine/aarch64-unix \
            >"$RUNNER_TEMP/baseline.md" || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/baseline.md"
          exit "$status"
      # what differs, for the first functions the compare's listing names (the listing is not the gate)
      - name: Disassemble what differs
        if: failure() && steps.baseline.outcome == 'failure'
        run: |
          engine=toolchains/engine/lib/wine/aarch64-unix/ntdll.so
          # shellcheck disable=SC2016 # the backticks are the report's
          sed -n 's/^  - `[a-z0-9_]*\.c: \([^ `]*\)`$/\1/p' "$RUNNER_TEMP/baseline.md" | sed -n 1,5p | while read -r f; do
            echo "== $f (< the engine's, > mine)"
            diff <(xcrun objdump -d --no-show-raw-insn --no-leading-addr --disassemble-symbols="_$f" "$engine" | tail -n +5) \
              <(xcrun objdump -d --no-show-raw-insn --no-leading-addr --disassemble-symbols="_$f" "$RUNNER_TEMP/baseline-ntdll.so" | tail -n +5) || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.baseline.outcome == 'failure'
        with:
          name: baseline-ntdll-${{ env.COMMIT }}
          path: ${{ runner.temp }}/baseline-ntdll.so
          retention-days: 7

      # One line of NtYieldExecution changed: a second sched_yield call, which also moves every
      # function the linker puts after it. The byte gate has to fail, and its listing has to name
      # NtYieldExecution and nothing outside sync.c, where NtDelayExecution may have it inlined.
      - name: The baseline compare fails on a broken build
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          f=dlls/ntdll/unix/sync.c
          sed -i '' '/^NTSTATUS WINAPI NtYieldExecution/,/^}/s/^    sched_yield();$/    sched_yield(); sched_yield();/' "$SRC/$f"
          # with "|| exit": macOS's bash 3.2 doesn't stop at a failed [[ ]] under -e
          [[ $(git -C "$SRC" diff --numstat) == $'1\t1\t'"$f" ]] || { echo "::error::the line to change isn't in $f"; exit 1; }
          "$GW2/ntdll.zsh" build
          status=0
          python3 -I "$GW2/ntdll-compare.py" baseline "$BUILD/dlls/ntdll/ntdll.so" toolchains/engine/lib/wine/aarch64-unix \
            >"$RUNNER_TEMP/broken.md" || status=$?
          git -C "$SRC" checkout -- "$f"
          cat "$RUNNER_TEMP/broken.md"
          # shellcheck disable=SC2016 # the backticks are the report's
          [[ $status == 1 ]] && grep -qF '`sync.c: NtYieldExecution`' "$RUNNER_TEMP/broken.md" &&
            ! grep '^  - `' "$RUNNER_TEMP/broken.md" | grep -v '^  - `sync\.c: '

      - name: Build this commit
        id: head
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          "$GW2/ntdll.zsh" checkout "$COMMIT"
          # every object compiled again, so none compared is one the base build left behind
          date +%s >"$RUNNER_TEMP/checkout-time"
          rm -f "$BUILD"/dlls/ntdll/unix/*.o
          "$GW2/ntdll.zsh" build | tee "$RUNNER_TEMP/head-build.log"
          (cd "$BUILD" && find include -type f -print0 | sort -z | xargs -0 shasum -a 256) >"$RUNNER_TEMP/head-headers.txt"
          diff "$RUNNER_TEMP/base-headers.txt" "$RUNNER_TEMP/head-headers.txt" ||
            { echo "::error::config.h or a generated header isn't the base build's"; exit 1; }
      - name: Compare
        id: compare
        if: ${{ !cancelled() && steps.head.outcome == 'success' }}
        run: |
          touched=()
          while IFS= read -r f; do touched+=("$f"); done < <(git -C "$SRC" diff --name-only "$BASE_COMMIT" "$COMMIT")
          status=0
          python3 -I "$GW2/ntdll-compare.py" patched "$BUILD/dlls/ntdll/ntdll.so" toolchains/engine/lib/wine/aarch64-unix \
            "$SRC" "$BUILD" "$RUNNER_TEMP/baseline-ntdll.so" "$RUNNER_TEMP/base-objects" \
            "$RUNNER_TEMP/base-build.log" "$RUNNER_TEMP/head-build.log" "$RUNNER_TEMP/base-Makefile" "$BUILD/Makefile" \
            "$(cat "$RUNNER_TEMP/checkout-time")" \
            "${touched[@]}" >"$RUNNER_TEMP/compare.md" || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/compare.md"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: compared-ntdll-${{ env.COMMIT }}
          path: ${{ env.BUILD }}/dlls/ntdll/ntdll.so
          retention-days: 7

      - name: Stage
        run: |
          mkdir dist
          cp "$BUILD/dlls/ntdll/ntdll.so" "$SRC/COPYING.LIB" "$SRC/LICENSE" dist/
          {
            strings -a dist/ntdll.so | grep -oE 'wine-[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+'
            echo "commit: $COMMIT"
            echo "base: $BASE_COMMIT ($(git -C "$SRC" describe "$BASE_COMMIT"))"
            echo "engine: Mach9 $MACH9_VERSION (wine-$MACH9_VERSION-macos-arm64.tar.xz, sha256 $MACH9_SHA256)"
            echo "toolchain: Xcode $(xcodebuild -version | sed -n 's/^Xcode //p') (macOS SDK $(xcrun -sdk macosx --show-sdk-version)), $(clang --version | sed -n 1p), llvm-mingw $LLVM_MINGW_VERSION, macOS $MACOSX_DEPLOYMENT_TARGET"
            echo "ntdll.so: sha256 $(shasum -a 256 dist/ntdll.so | cut -d' ' -f1)"
            echo
            cat "$RUNNER_TEMP/baseline.md"
            echo
            cat "$RUNNER_TEMP/compare.md"
          } >dist/VERSION
          cat dist/VERSION
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntdll-mach9-${{ env.COMMIT }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Tests on the engine
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: zsh syntax
        run: for f in .github/gw2/*.zsh tests/gw2/*.zsh; do zsh -n "$f"; echo "ok $f"; done

      - name: Restore Mach9
        id: mach9
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mach9-tarball-${{ env.MACH9_VERSION }}
          path: toolchains/mach9.tar.xz
      - name: Download Mach9
        if: steps.mach9.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          curl -fsSL --retry 3 -o toolchains/mach9.tar.xz \
            "https://github.com/athei/mach9/releases/download/$MACH9_VERSION/wine-$MACH9_VERSION-macos-arm64.tar.xz"
      - name: Restore llvm-mingw
        id: mingw
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          path: toolchains/llvm-mingw
      - name: Download llvm-mingw
        if: steps.mingw.outputs.cache-hit != 'true'
        run: |
          f="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$f"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$f" | shasum -a 256 -c
          mkdir -p toolchains/llvm-mingw
          tar -xf "$RUNNER_TEMP/$f" -C toolchains/llvm-mingw --strip-components 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ntdll-mach9-${{ env.COMMIT }}
          path: ${{ runner.temp }}/dist

      # Two copies of the engine, the second with my ntdll.so; APFS clones, so the copy is free
      - name: Unpack the engine
        run: |
          echo "$MACH9_SHA256  toolchains/mach9.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/engine"
          tar -xf toolchains/mach9.tar.xz -C "$RUNNER_TEMP/engine"
          cp -Rc "$RUNNER_TEMP/engine" "$RUNNER_TEMP/mine"
          install -m 755 "$RUNNER_TEMP/dist/ntdll.so" "$RUNNER_TEMP/mine/wine/lib/wine/aarch64-unix/ntdll.so"
          xattr -drs com.apple.quarantine "$RUNNER_TEMP/engine" "$RUNNER_TEMP/mine"
          shasum -a 256 "$RUNNER_TEMP"/{engine,mine}/wine/lib/wine/aarch64-unix/ntdll.so
          "$RUNNER_TEMP/mine/wine/bin/wine" --version
      - name: Build the test programs
        run: |
          mkdir "$RUNNER_TEMP/tests"
          for c in tests/gw2/*.c; do
            toolchains/llvm-mingw/bin/x86_64-w64-mingw32-clang -O2 -Wall -Werror -o "$RUNNER_TEMP/tests/$(basename "$c" .c).exe" "$c"
          done
          ls "$RUNNER_TEMP/tests"
      - name: Run them
        run: tests/gw2/matrix.zsh "$RUNNER_TEMP/engine/wine" "$RUNNER_TEMP/mine/wine" "$RUNNER_TEMP/tests" "$RUNNER_TEMP/matrix"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/gw2.yml
      - name: Python
        run: python3 -I -m py_compile .github/gw2/ntdll-compare.py

  publish:
    name: Publish
    needs: [build, tests, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Two pushes never upload at once: the workflow's concurrency group runs one push to gw2-on-mac
    # at a time and never cancels it. A group of this job's own would let a pull request's pending
    # job cancel a push's, as it did to run 43116636183's upload.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: mach9-builds
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ntdll-mach9-${{ env.COMMIT }}
          path: dist
      - name: Pack
        run: |
          name="ntdll-mach9-$COMMIT.tar.xz"
          chmod 755 dist/ntdll.so
          chmod 644 dist/VERSION dist/COPYING.LIB dist/LICENSE
          tar --sort=name --owner=0 --group=0 --numeric-owner -C dist -cJf "$name" ntdll.so VERSION COPYING.LIB LICENSE
          tar -tvJf "$name"
          sha256sum "$name" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload to the pre-release ${{ env.RELEASE }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/gw2-on-mac'
        run: |
          name="ntdll-mach9-$COMMIT.tar.xz"
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" --prerelease --latest=false --target "$COMMIT" --title "Mach9 builds of my ntdll.so" \
              --notes "CI output for GW2 on Mac's arm64 line, not a release of Wine: my ntdll.so for Mach9 $MACH9_VERSION's engine, built and checked by .github/workflows/gw2.yml for each push to gw2-on-mac. One asset per commit, ntdll-mach9-<full sha>.tar.xz; the 30 newest stay."
          fi
          uploaded=0
          # grep without -q, which would end the pipe early and fail it under pipefail
          if gh release view "$RELEASE" --json assets -q '.assets[].name' | grep -xF "$name" >/dev/null; then
            echo "$name is there already, and a published file is never replaced"
          else
            gh release upload "$RELEASE" "$name"
            uploaded=1
          fi
          # the 30 newest assets stay
          id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE" -q .id)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" -q '.[] | [.created_at, .id, .name] | @tsv' |
            grep -P '\tntdll-mach9-[0-9a-f]{40}\.tar\.xz$' | sort -r | tail -n +31 | while IFS=$'\t' read -r _ asset old; do
              echo "deleting $old"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"
            done
          digest=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE" -q ".assets[] | select(.name == \"$name\") | .digest")
          echo "$RELEASE has $name, $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $digest == sha256:* ]]
          (( !uploaded )) || [[ $digest == "sha256:$(sha256sum "$name" | cut -d' ' -f1)" ]]
          latest=$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name 2>/dev/null || true)
          echo "releases/latest: ${latest:-none}"
          [[ $latest != "$RELEASE" ]]
